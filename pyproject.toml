[project]
name = "agentkv"
version = "0.1.0"
description = "Cache-aware context compaction for long-horizon LLM agents"
requires-python = ">=3.10,<3.13"
readme = "README.md"
dependencies = [
    "vllm==0.8.5",
    "torch==2.6.0",
    "transformers>=4.51.0,<5.0.0",
    "numpy>=1.26,<2.0",
    "pandas>=2.2,<3.0",
    "pyarrow>=16.0,<18.0",
    "pydantic>=2.7,<3.0",
    "pyyaml>=6.0,<7.0",
    "matplotlib>=3.8,<4.0",
    "nvidia-ml-py>=12.560.30",
    "httpx>=0.27,<1.0",
    "rich>=13.7,<14.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-cov>=5.0,<6.0",
    "mypy>=1.10,<2.0",
    "ruff>=0.6,<1.0",
    "types-PyYAML",
    "pandas-stubs",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.mypy]
python_version = "3.12"
strict = true
namespace_packages = true
explicit_package_bases = true
mypy_path = "src"

# vllm is Linux/WSL2-only and untyped from mypy's perspective on some hosts;
# pynvml ships no stubs/py.typed marker. Both are imported lazily inside
# functions specifically so the rest of the codebase stays strictly checked.
[[tool.mypy.overrides]]
module = ["vllm.*", "pynvml.*"]
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
